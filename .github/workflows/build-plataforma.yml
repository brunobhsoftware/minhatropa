# Publica a plataforma (pasta plataforma/) em minhatropa.com.br.
#
# A cada push na main que mexa em plataforma/: instala as dependências PHP sem as de
# desenvolvimento e grava o resultado na branch `publicacao`. A Hostinger acompanha essa
# branch e atualiza o public_html sozinha.
#
# A branch `publicacao` NUNCA recebe docs/ nem CLAUDE.md, e não deve ser editada à mão.
# O .env de produção fica fora do public_html (ver bootstrap/app.php) e não passa por aqui.
name: Publicar plataforma

on:
  push:
    branches: [main]
    paths: ["plataforma/**", ".github/workflows/build-plataforma.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-plataforma
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, intl, bcmath, zip
          coverage: none

      - name: Instalar dependências (produção)
        working-directory: plataforma
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts

      - name: Conferir a aplicação
        working-directory: plataforma
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
          php artisan route:list > /dev/null
          php artisan view:cache && php artisan view:clear
          rm .env

      - name: Gravar na branch publicacao
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC="$GITHUB_WORKSPACE/plataforma"
          OUT="$(mktemp -d)"
          REPO="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Continua o histórico da branch (sem force push), para o pull da Hostinger sempre funcionar.
          git clone --quiet --depth 1 --branch publicacao "$REPO" "$OUT"
          find "$OUT" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude node_modules --exclude tests --exclude .env --exclude 'storage/logs/*.log' \
            --exclude phpunit.xml --exclude .editorconfig --exclude README.md "$SRC"/ "$OUT"/
          # O .gitignore do Laravel ignora vendor/; aqui ele precisa ir junto.
          printf '/node_modules\n/storage/*.key\n/storage/logs/*.log\n.env\n' > "$OUT/.gitignore"
          cd "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -q -m "Publica plataforma a partir de ${GITHUB_SHA::7}"
          git push --quiet origin publicacao
